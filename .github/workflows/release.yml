name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore PetrolPumpMS.App

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish PetrolPumpMS.App
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish

      - name: Copy appsettings.json into publish folder
        run: Copy-Item -Path "PetrolPumpMS.App/appsettings.json" -Destination "./publish/appsettings.json" -Force

      - name: Zip published output
        run: Compress-Archive -Path ./publish/* -DestinationPath "PetrolPumpMS-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PetrolPumpMS-${{ github.ref_name }}-win-x64.zip
          name: ${{ github.ref_name }}
          generate_release_notes: true
